# cloud-storage за nginx: отдаётся из подкаталога /cloud-storage/
#
# Эти блоки вставляются в существующий server-блок домена (файл с
# server_name sk1fix.website; listen 443 ssl) — рядом с location /meet/.
# TLS, редирект 80->443 и продление сертификата уже обслуживает certbot.
#
# Со стороны приложения должны совпадать три вещи:
#   VITE_BASE_PATH=/cloud-storage/   (сборка SPA, аргумент сборки образа)
#   ROOT_PATH=/cloud-storage         (root_path FastAPI, .env сервиса)
#   location /cloud-storage/         (этот файл)

    # Без слэша путь не попадёт в location /cloud-storage/ и уйдёт в `location /` (404),
    # поэтому сначала канонизируем адрес.
    location = /cloud-storage {
        return 301 /cloud-storage/;
    }

    location /cloud-storage/ {
        # Слэш на конце proxy_pass снимает префикс /cloud-storage/ перед отправкой
        # в контейнер: /cloud-storage/api/health -> /api/health.
        proxy_pass http://127.0.0.1:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Лимит тела запроса. По умолчанию в nginx 1m — все загрузки больше
        # мегабайта получат 413 ещё до контейнера.
        # Держать в соответствии с MAX_UPLOAD_SIZE_BYTES в .env сервиса.
        client_max_body_size 5g;

        # Загрузку не буферизуем на диск nginx: поток идёт сразу в приложение,
        # а оно — в MinIO. Так большой файл не занимает место дважды.
        proxy_request_buffering off;

        # Отдачу файлов тоже стримим без промежуточной записи в /var/cache/nginx.
        proxy_buffering off;

        # Файлы качаются и заливаются дольше обычного запроса.
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }
