name: cloud-storage

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-storage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storage_secret}
      POSTGRES_DB: ${POSTGRES_DB:-storage}
    volumes:
      # Именованный том, а не bind-mount на /mnt/c: WSL/drvfs не поддерживает
      # chmod, и initdb падает на «could not change permissions».
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-storage} -d ${POSTGRES_DB:-storage}
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    build:
      context: .
      dockerfile: Dockerfile.minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      # Бакеты лежат в папке хоста
      - ${MINIO_DATA_DIR:-./data/minio}:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Внешний префикс SPA; должен совпадать с ROOT_PATH и location в nginx
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Внутри docker-сети адреса другие, чем на хосте
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MINIO_ENDPOINT: minio:9000
      LOGS_PATH: /app/logs
      SPA_DIR: /app/static
    volumes:
      - ./logs:/app/logs
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          with urllib.request.urlopen("http://127.0.0.1:8000/api/health") as r:
              raise SystemExit(0 if r.status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  pgdata:
